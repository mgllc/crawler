name: Workspace rebuild
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '13 4 * * *'
permissions:
  contents: read
concurrency:
  group: workspace-rebuild-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    name: Python compilation, existing suites and evidence watch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Compile Python sources
        run: python3 -m compileall -q crawler crawler.py self_healing.py
      - name: Run existing suites and offline evidence-watch contracts
        run: python3 -m unittest test_crawler tests.test_crawler tests.test_watch -v
      - name: Record execution evidence
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          VALIDATION_SCOPE: 'Python compilation, existing suites and offline evidence-watch contracts; no live collection'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = dict(schema=1, repository=os.environ['GITHUB_REPOSITORY'],
                        commit=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                        status=os.environ['BUILD_STATUS'], scope=os.environ['VALIDATION_SCOPE'])
          Path('workspace-rebuild.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Workspace rebuild: ' + report['status'] + '\n\n' + report['scope'] + '\n')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: workspace-rebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workspace-rebuild.json
          if-no-files-found: error
          retention-days: 30
